# TEMPLATE ONLY — review and adapt in aaPanel; do not paste into production as-is.
# This uses the current flat CI3 layout. A dedicated public/ document root is
# preferable after index.php paths are moved and tested.
server {
	listen 443 ssl;
	server_name study.example.com;
	root /var/www/study;
	index index.php;
	# Allow multipart overhead; the application independently caps each image at 3 MiB.
	client_max_body_size 8m;

	# Replace with the certificate paths managed by aaPanel / Let's Encrypt.
	ssl_certificate     /path/from/aapanel/fullchain.pem;
	ssl_certificate_key /path/from/aapanel/privkey.pem;

	# Never expose framework, application, build, QA, or internal documentation.
	location ~* ^/(?:application|system|docs|scripts|sql|vendor|node_modules)(?:/|$) {
		return 404;
	}
	location ~ /\.(?!well-known(?:/|$)) {
		return 404;
	}
	location ~* \.(?:md|rst|log|sql|sql\.gz|zip|bak|ini|env|ya?ml|toml|lock)$ {
		return 404;
	}
	location ~* ^/(?:composer\.json|package(?:-lock)?\.json|readme\.rst|license\.txt)$ {
		return 404;
	}

	# Static files must exist. Apply baseline headers to assets without exposing
	# private source or relying on Apache .htaccess (which Nginx ignores).
	location ~* ^/assets/.+\.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
		try_files $uri =404;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options DENY always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
	}

	location / {
		# Do not serve arbitrary files from the flat project root.
		rewrite ^ /index.php last;
	}

	# Legacy index.php/path links and POST requests must reach the same front
	# controller. Generated CI3 links now use clean URLs. For the optional GET/HEAD
	# canonical redirect used on aaPanel, see PANEL_MONITORING_SERVER.md.
	location ^~ /index.php/ {
		rewrite ^ /index.php last;
	}
	location ~* \.php(?:/|$) {
		return 404;
	}

	location = /index.php {
		try_files $uri =404;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param HTTPS on;
		# index.php accepts CI_ENV from the FastCGI server environment. Define
		# secrets and APP_BASE_URL in the PHP-FPM pool, not in this public vhost.
		fastcgi_param CI_ENV production;
		fastcgi_pass unix:/run/php/php8.1-fpm.sock;
	}
}
