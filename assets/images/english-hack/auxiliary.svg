<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">02 / Pembuka pertanyaan</title><desc id="desc">Cari auxiliary lebih dulu. Setelah does/did, verb utama kembali ke V1. Contoh umum pertanyaan afirmatif. Emphasis, negation, dan indirect questions memerlukan pembahasan tersendiri.</desc><rect x="0" y="0" width="1200" height="640" rx="16" fill="#fffdf7" stroke="none"/><rect x="0" y="0" width="1200" height="116" rx="16" fill="#102f3b" stroke="none"/><text x="36" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">02 / Pembuka pertanyaan</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d9f1e6">Cari auxiliary lebih dulu. Setelah does/did, verb utama kembali ke V1.</text><rect x="32" y="140" width="1136" height="86" rx="16" fill="#d9f1e6" stroke="none"/><text x="50" y="173" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">Ada BE?</text><text x="50" y="204" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">Balik be dan subject.</text><text x="650" y="189" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">She is ready. → Is she ready?</text><rect x="32" y="240" width="1136" height="86" rx="16" fill="#ffe4a5" stroke="none"/><text x="50" y="273" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">Ada modal / auxiliary?</text><text x="50" y="304" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">Pindahkan auxiliary pertama.</text><text x="650" y="289" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">She can swim. → Can she swim?</text><rect x="32" y="340" width="1136" height="86" rx="16" fill="#d9f1e6" stroke="none"/><text x="50" y="373" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">Simple present / past, verb lain?</text><text x="50" y="404" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">Tambahkan do / does / did + V1.</text><text x="650" y="389" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">She works. → Does she work?</text><rect x="32" y="440" width="1136" height="86" rx="16" fill="#ffe4a5" stroke="none"/><text x="50" y="473" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">Who/what menjadi subject?</text><text x="50" y="504" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">Biasanya tanpa do pada pertanyaan afirmatif.</text><text x="650" y="489" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">Who works here? / What happened?</text><text x="36" y="586" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">Contoh umum pertanyaan afirmatif. Emphasis, negation, dan indirect questions memerlukan pembahasan tersendiri.</text></svg>