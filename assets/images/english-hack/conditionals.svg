<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">05 / Pilih waktu andaian</title><desc id="desc">Tentukan waktu kondisi dan hasil, baru pilih bentuk. Ini pola inti, bukan semua kemungkinan conditional. Modals lain, imperatives, dan konteks khusus dibahas saat penerapan.</desc><rect x="0" y="0" width="1200" height="740" rx="16" fill="#fffdf7" stroke="none"/><rect x="0" y="0" width="1200" height="116" rx="16" fill="#102f3b" stroke="none"/><text x="36" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">05 / Pilih waktu andaian</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d9f1e6">Tentukan waktu kondisi dan hasil, baru pilih bentuk.</text><rect x="32" y="140" width="1136" height="88" rx="16" fill="#d9f1e6" stroke="none"/><text x="48" y="171" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">ZERO</text><text x="194" y="171" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183d47">if + present, present</text><text x="194" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">If water freezes, it expands.</text><text x="890" y="172" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">hubungan umum</text><rect x="32" y="240" width="1136" height="88" rx="16" fill="#ffe4a5" stroke="none"/><text x="48" y="271" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">FIRST</text><text x="194" y="271" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183d47">if + present, will + V1</text><text x="194" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">If it rains, we will stay in.</text><text x="890" y="272" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">kemungkinan ke depan</text><rect x="32" y="340" width="1136" height="88" rx="16" fill="#d9f1e6" stroke="none"/><text x="48" y="371" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">SECOND</text><text x="194" y="371" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183d47">if + past, would + V1</text><text x="194" y="405" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">If I had time, I would join.</text><text x="890" y="372" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">andaian kini / nanti</text><rect x="32" y="440" width="1136" height="88" rx="16" fill="#ffe4a5" stroke="none"/><text x="48" y="471" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">THIRD</text><text x="194" y="471" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183d47">if + had V3, would have V3</text><text x="194" y="505" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">If I had known, I would have helped.</text><text x="890" y="472" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">andaian lampau</text><rect x="32" y="540" width="1136" height="88" rx="16" fill="#d9f1e6" stroke="none"/><text x="48" y="571" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">MIXED</text><text x="194" y="571" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183d47">if + had V3, would + V1 now</text><text x="194" y="605" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">If I had saved it, I would have a copy now.</text><text x="890" y="572" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">lampau → kini</text><text x="36" y="686" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">Ini pola inti, bukan semua kemungkinan conditional. Modals lain, imperatives, dan konteks khusus dibahas saat</text><text x="36" y="711" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">penerapan.</text></svg>