<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">06 / Passive: fokus berpindah</title><desc id="desc">Tense/aspect ada pada rangkaian auxiliary; verb utama tetap V3. Passive lazim untuk verb yang dapat memiliki objek. Sebut pelaku bila tanggung jawab atau sumber informasi penting.</desc><rect x="0" y="0" width="1200" height="620" rx="16" fill="#fffdf7" stroke="none"/><rect x="0" y="0" width="1200" height="116" rx="16" fill="#102f3b" stroke="none"/><text x="36" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">06 / Passive: fokus berpindah</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d9f1e6">Tense/aspect ada pada rangkaian auxiliary; verb utama tetap V3.</text><rect x="32" y="145" width="1136" height="160" rx="16" fill="#d9f1e6" stroke="none"/><text x="56" y="182" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#183d47">ACTIVE: The team checks the files.</text><text x="56" y="235" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#183d47">PASSIVE: The files are checked by the team.</text><text x="56" y="276" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#183d47">Objek menjadi fokus → sesuaikan BE → verb utama V3.</text><rect x="32" y="326" width="556" height="78" rx="16" fill="#ffe4a5" stroke="none"/><text x="50" y="355" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">present: am/is/are + V3</text><text x="50" y="386" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">The file is checked.</text><rect x="612" y="326" width="556" height="78" rx="16" fill="#ffe4a5" stroke="none"/><text x="630" y="355" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">past: was/were + V3</text><text x="630" y="386" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">The file was checked.</text><rect x="32" y="418" width="556" height="78" rx="16" fill="#ffe4a5" stroke="none"/><text x="50" y="447" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">perfect: has/have been + V3</text><text x="50" y="478" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">The file has been checked.</text><rect x="612" y="418" width="556" height="78" rx="16" fill="#ffe4a5" stroke="none"/><text x="630" y="447" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#183d47">modal: modal + be + V3</text><text x="630" y="478" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#183d47">The file must be checked.</text><text x="36" y="566" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">Passive lazim untuk verb yang dapat memiliki objek. Sebut pelaku bila tanggung jawab atau sumber informasi</text><text x="36" y="591" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">penting.</text></svg>