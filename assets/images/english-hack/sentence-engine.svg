<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">01 / Mesin kalimat</title><desc id="desc">Kunci awal: jangan menempelkan is pada setiap kalimat. S = subject. Pelengkap menjelaskan identitas, sifat, atau tempat. Pola tindakan memiliki verb utama.</desc><rect x="0" y="0" width="1200" height="620" rx="16" fill="#fffdf7" stroke="none"/><rect x="0" y="0" width="1200" height="116" rx="16" fill="#102f3b" stroke="none"/><text x="36" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">01 / Mesin kalimat</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d9f1e6">Kunci awal: jangan menempelkan is pada setiap kalimat.</text><rect x="32" y="146" width="548" height="250" rx="16" fill="#d9f1e6" stroke="none"/><text x="54" y="184" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d47">KEADAAN / IDENTITAS</text><text x="54" y="231" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#183d47">S + be + pelengkap</text><text x="54" y="276" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#183d47">She is happy.</text><text x="54" y="318" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">be dapat diikuti adjective, noun, atau</text><text x="54" y="346" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">place.</text><rect x="620" y="146" width="548" height="250" rx="16" fill="#ffe4a5" stroke="none"/><text x="642" y="184" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d47">TINDAKAN / KEBIASAAN</text><text x="642" y="231" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#183d47">S + V1 / V-s</text><text x="642" y="276" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#183d47">She studies English.</text><text x="642" y="318" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">Verb utama menyatakan tindakan/kebiasaan.</text><rect x="32" y="418" width="1136" height="110" rx="16" fill="#e9edf0" stroke="none"/><text x="56" y="452" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#183d47">Tanya dulu: predikatnya BE atau kata kerja lain?</text><text x="56" y="494" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#183d47">She is happy.  →  Is she happy?     |     She studies.  →  Does she study?</text><text x="36" y="566" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">S = subject. Pelengkap menjelaskan identitas, sifat, atau tempat. Pola tindakan memiliki verb utama.</text></svg>