<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">03 / Peta 12 kombinasi tense–aspect</title><desc id="desc">Peta belajar, bukan daftar rumus yang harus dihafal sekaligus. *Future di sini memakai will sebagai pola bantu. Going to, present continuous, dan present simple juga bisa merujuk masa depan.</desc><rect x="0" y="0" width="1200" height="750" rx="16" fill="#fffdf7" stroke="none"/><rect x="0" y="0" width="1200" height="116" rx="16" fill="#102f3b" stroke="none"/><text x="36" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">03 / Peta 12 kombinasi tense–aspect</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d9f1e6">Peta belajar, bukan daftar rumus yang harus dihafal sekaligus.</text><rect x="174" y="142" width="236" height="63" rx="16" fill="#102f3b" stroke="none"/><text x="186" y="167" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">SIMPLE</text><text x="186" y="191" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#d9f1e6">fakta / kejadian</text><rect x="422" y="142" width="236" height="63" rx="16" fill="#102f3b" stroke="none"/><text x="434" y="167" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">CONTINUOUS</text><text x="434" y="191" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#d9f1e6">proses</text><rect x="670" y="142" width="236" height="63" rx="16" fill="#102f3b" stroke="none"/><text x="682" y="167" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">PERFECT</text><text x="682" y="191" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#d9f1e6">sebelum titik acuan</text><rect x="918" y="142" width="236" height="63" rx="16" fill="#102f3b" stroke="none"/><text x="930" y="167" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">PERFECT CONTINUOUS</text><text x="930" y="191" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#d9f1e6">durasi ke titik acuan</text><text x="32" y="270" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183d47">PRESENT</text><rect x="174" y="220" width="236" height="117" rx="16" fill="#d9f1e6" stroke="none"/><text x="186" y="248" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">V1 / V-s</text><text x="186" y="303" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She works.</text><rect x="422" y="220" width="236" height="117" rx="16" fill="#d9f1e6" stroke="none"/><text x="434" y="248" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">am/is/are + V-ing</text><text x="434" y="303" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She is working.</text><rect x="670" y="220" width="236" height="117" rx="16" fill="#d9f1e6" stroke="none"/><text x="682" y="248" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">have/has + V3</text><text x="682" y="303" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She has worked.</text><rect x="918" y="220" width="236" height="117" rx="16" fill="#d9f1e6" stroke="none"/><text x="930" y="248" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">have/has been + V-ing</text><text x="930" y="303" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She has been working.</text><text x="32" y="402" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183d47">PAST</text><rect x="174" y="352" width="236" height="117" rx="16" fill="#ffe4a5" stroke="none"/><text x="186" y="380" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">V2</text><text x="186" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She worked.</text><rect x="422" y="352" width="236" height="117" rx="16" fill="#ffe4a5" stroke="none"/><text x="434" y="380" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">was/were + V-ing</text><text x="434" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She was working.</text><rect x="670" y="352" width="236" height="117" rx="16" fill="#ffe4a5" stroke="none"/><text x="682" y="380" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">had + V3</text><text x="682" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She had worked.</text><rect x="918" y="352" width="236" height="117" rx="16" fill="#ffe4a5" stroke="none"/><text x="930" y="380" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">had been + V-ing</text><text x="930" y="435" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She had been working.</text><text x="32" y="534" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183d47">FUTURE*</text><rect x="174" y="484" width="236" height="117" rx="16" fill="#d9f1e6" stroke="none"/><text x="186" y="512" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">will + V1</text><text x="186" y="567" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She will work.</text><rect x="422" y="484" width="236" height="117" rx="16" fill="#d9f1e6" stroke="none"/><text x="434" y="512" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">will be + V-ing</text><text x="434" y="567" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She will be working.</text><rect x="670" y="484" width="236" height="117" rx="16" fill="#d9f1e6" stroke="none"/><text x="682" y="512" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">will have + V3</text><text x="682" y="567" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She will have worked.</text><rect x="918" y="484" width="236" height="117" rx="16" fill="#d9f1e6" stroke="none"/><text x="930" y="512" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">will have been + V-ing</text><text x="930" y="567" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#183d47">She will have been working.</text><text x="36" y="696" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">*Future di sini memakai will sebagai pola bantu. Going to, present continuous, dan present simple juga bisa</text><text x="36" y="721" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">merujuk masa depan.</text></svg>