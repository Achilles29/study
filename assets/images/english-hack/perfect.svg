<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">04 / Perfect menghubungkan dua titik</title><desc id="desc">Pertanyaannya: sebelum titik acuan yang mana? Perfect tidak selalu berarti selesai. Dengan keadaan/durasi, situasi dapat berlanjut. For = durasi; since = titik awal.</desc><rect x="0" y="0" width="1200" height="620" rx="16" fill="#fffdf7" stroke="none"/><rect x="0" y="0" width="1200" height="116" rx="16" fill="#102f3b" stroke="none"/><text x="36" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">04 / Perfect menghubungkan dua titik</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d9f1e6">Pertanyaannya: sebelum titik acuan yang mana?</text><text x="35" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">PAST PERFECT</text><path d="M 310 179 H 1110" stroke="#183d47" stroke-width="3"/><circle cx="430" cy="179" r="9" fill="#b16c00"/><circle cx="960" cy="179" r="11" fill="#167c64"/><text x="350" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">sebelum</text><text x="870" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">titik lampau</text><text x="310" y="222" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183d47">When I arrived, she had left.</text><text x="35" y="290" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">PRESENT PERFECT</text><path d="M 310 304 H 1110" stroke="#183d47" stroke-width="3"/><circle cx="430" cy="304" r="9" fill="#b16c00"/><circle cx="960" cy="304" r="11" fill="#167c64"/><text x="350" y="282" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">sebelum / sejak</text><text x="870" y="282" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">sekarang</text><text x="310" y="347" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183d47">I have lived here for two years.</text><text x="35" y="415" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">FUTURE PERFECT</text><path d="M 310 429 H 1110" stroke="#183d47" stroke-width="3"/><circle cx="430" cy="429" r="9" fill="#b16c00"/><circle cx="960" cy="429" r="11" fill="#167c64"/><text x="350" y="407" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">sebelum</text><text x="870" y="407" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183d47">titik masa depan</text><text x="310" y="472" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183d47">By Friday, I will have finished.</text><text x="36" y="566" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">Perfect tidak selalu berarti selesai. Dengan keadaan/durasi, situasi dapat berlanjut. For = durasi; since =</text><text x="36" y="591" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">titik awal.</text></svg>