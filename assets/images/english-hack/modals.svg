<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">07 / Modal: bentuk kecil, makna berbeda</title><desc id="desc">Tentukan fungsi: izin, kewajiban, saran, atau perkiraan. Sesudah modal gunakan base verb. Untuk perkiraan lampau: may/might/must/can’t + have + V3. Makna mengikuti konteks.</desc><rect x="0" y="0" width="1200" height="620" rx="16" fill="#fffdf7" stroke="none"/><rect x="0" y="0" width="1200" height="116" rx="16" fill="#102f3b" stroke="none"/><text x="36" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">07 / Modal: bentuk kecil, makna berbeda</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d9f1e6">Tentukan fungsi: izin, kewajiban, saran, atau perkiraan.</text><rect x="32" y="145" width="556" height="160" rx="16" fill="#d9f1e6" stroke="none"/><text x="54" y="182" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">LARANGAN</text><text x="54" y="228" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183d47">You must not enter.</text><text x="54" y="272" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#183d47">Tidak boleh masuk.</text><rect x="612" y="145" width="556" height="160" rx="16" fill="#ffe4a5" stroke="none"/><text x="634" y="182" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">TIDAK WAJIB</text><text x="634" y="228" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183d47">You do not have to enter.</text><text x="634" y="272" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#183d47">Boleh masuk, boleh tidak.</text><rect x="32" y="325" width="556" height="160" rx="16" fill="#d9f1e6" stroke="none"/><text x="54" y="362" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">DEDUKSI</text><text x="54" y="408" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183d47">She must be busy.</text><text x="54" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#183d47">Kesimpulan kuat menurut bukti.</text><rect x="612" y="325" width="556" height="160" rx="16" fill="#ffe4a5" stroke="none"/><text x="634" y="362" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183d47">KEMUNGKINAN</text><text x="634" y="408" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183d47">She might be busy.</text><text x="634" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#183d47">Kemungkinan, belum pasti.</text><text x="36" y="566" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">Sesudah modal gunakan base verb. Untuk perkiraan lampau: may/might/must/can’t + have + V3. Makna mengikuti</text><text x="36" y="591" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">konteks.</text></svg>