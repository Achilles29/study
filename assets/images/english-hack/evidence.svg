<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">08 / Argumen yang dapat dipercaya</title><desc id="desc">Bahasa profesional menyampaikan alasan sekaligus batasnya. Data rekaan dalam latihan harus tetap disebut rekaan. Korelasi/urutan waktu saja tidak membuktikan sebab.</desc><rect x="0" y="0" width="1200" height="580" rx="16" fill="#fffdf7" stroke="none"/><rect x="0" y="0" width="1200" height="116" rx="16" fill="#102f3b" stroke="none"/><text x="36" y="49" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">08 / Argumen yang dapat dipercaya</text><text x="36" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#d9f1e6">Bahasa profesional menyampaikan alasan sekaligus batasnya.</text><rect x="32" y="155" width="266" height="310" rx="16" fill="#d9f1e6" stroke="none"/><text x="52" y="198" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d47">01 / CLAIM</text><text x="52" y="246" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#183d47">What do you think?</text><text x="52" y="344" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">Tulis klaim dengan</text><text x="52" y="372" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">cakupan jelas.</text><rect x="322" y="155" width="266" height="310" rx="16" fill="#ffe4a5" stroke="none"/><text x="342" y="198" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d47">02 / EVIDENCE</text><text x="342" y="246" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#183d47">What supports it?</text><text x="342" y="344" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">Sebut sumber, angka,</text><text x="342" y="372" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">dan denominator.</text><rect x="612" y="155" width="266" height="310" rx="16" fill="#d9f1e6" stroke="none"/><text x="632" y="198" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d47">03 / LIMIT</text><text x="632" y="246" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#183d47">What is still</text><text x="632" y="278" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#183d47">unknown?</text><text x="632" y="344" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">Jangan ubah dugaan</text><text x="632" y="372" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">menjadi fakta.</text><rect x="902" y="155" width="266" height="310" rx="16" fill="#ffe4a5" stroke="none"/><text x="922" y="198" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#183d47">04 / ACTION</text><text x="922" y="246" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#183d47">What should happen</text><text x="922" y="278" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#183d47">next?</text><text x="922" y="344" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">Rekomendasi sebanding</text><text x="922" y="372" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#183d47">dengan bukti.</text><text x="36" y="526" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#183d47">Data rekaan dalam latihan harus tetap disebut rekaan. Korelasi/urutan waktu saja tidak membuktikan sebab.</text></svg>